name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["index.html", "data/**", "og-image.png", ".github/workflows/**"]
  workflow_dispatch: {}          # manual run button

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Publish only the site itself — work logs, backups and mockups stay in the repo, not on the site.
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          cp og-image.png _site/
          cp -r data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
