<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山日和 YAMABIYORI — Hiking Planner Prototype</title>
<meta name="description" content="日本の山の登山計画サイト — 日付から山を選ぶ、山から日を選ぶ。風・雨・凍結高度から理由つきで算出する独自の登山指数と、登山口までの公共交通・山小屋・ルート・季節情報。日本百名山100座を含む110山を収録。">
<meta property="og:title" content="山日和 YAMABIYORI — Japan Hiking Planner">
<meta property="og:description" content="風・雨・凍結高度から理由つきで算出する独自の登山指数。公共交通アクセス・山小屋・ルート・季節情報つき。日本百名山100座を含む110山。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lowellbattles.github.io/yama-biyori/">
<meta property="og:image" content="https://lowellbattles.github.io/yama-biyori/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="山日和 YAMABIYORI — 判子風の「山」スタンプと、登山指数・公共交通・山小屋 110座">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://lowellbattles.github.io/yama-biyori/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg transform='rotate(-6 32 32)'%3E%3Ccircle cx='32' cy='32' r='27' fill='%23F1F3EC' stroke='%23C2452F' stroke-width='5'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='%23C2452F' font-family='serif' font-weight='700'%3E%E5%B1%B1%3C/text%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
:root{
  --paper:#F1F3EC;
  --paper-deep:#E7EAE0;
  --card:#FBFCF8;
  --ink:#26302A;
  --ink-soft:#5B6660;
  --contour:#CFC9B4;
  --line:#DDD9C8;
  --pine:#2E4B38;
  --lake:#3E6B8C;
  --shu:#C2452F;
  --grade-a:#2E7D4F;
  --grade-b:#C08A2D;
  --grade-c:#C2452F;
  --mono:'IBM Plex Mono',monospace;
  --gothic:'Zen Kaku Gothic New',sans-serif;
  --mincho:'Shippori Mincho',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--gothic);
  background:var(--paper);
  color:var(--ink);
  line-height:1.6;
  background-image:repeating-radial-gradient(circle at 8% -20%, transparent 0 119px, rgba(139,125,90,.07) 119px 120px),
                   repeating-radial-gradient(circle at 105% 130%, transparent 0 139px, rgba(139,125,90,.06) 139px 140px);
}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 64px}

/* ---------- header ---------- */
header{padding:28px 0 10px;border-bottom:2px solid var(--ink);position:relative}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-right:88px}
.lang-btn{position:absolute;top:26px;right:0;font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:5px 11px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:4px;cursor:pointer}
.lang-btn:hover{background:var(--ink);color:var(--paper)}
.lang-btn:focus-visible{outline:2px solid var(--lake);outline-offset:2px}
.lang-note{font-size:12px;color:var(--ink-soft);background:var(--paper-deep);border-radius:4px;padding:8px 12px;margin:10px 0 0}
.en-name{font-family:var(--gothic);font-size:13px;font-weight:500;color:var(--ink-soft);letter-spacing:0}
.brand h1{font-family:var(--mincho);font-weight:800;font-size:clamp(30px,6vw,44px);letter-spacing:.12em}
.brand .romaji{font-family:var(--mono);font-size:12px;letter-spacing:.32em;color:var(--ink-soft);text-transform:uppercase}
.tagline{margin-top:4px;font-size:13px;color:var(--ink-soft)}
.proto-chip{display:inline-block;margin-left:10px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;border:1px solid var(--shu);color:var(--shu);padding:1px 7px;border-radius:2px;vertical-align:middle}

/* ---------- controls ---------- */
.controls{position:sticky;top:0;z-index:20;background:linear-gradient(var(--paper) 88%,transparent);padding:14px 0 10px}
.view-toggle{display:inline-flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;margin-bottom:12px}
.view-toggle button{font-family:var(--gothic);font-weight:700;font-size:13px;padding:7px 18px;background:transparent;border:none;cursor:pointer;color:var(--ink)}
.view-toggle button.active{background:var(--ink);color:var(--paper)}
.date-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.date-chip{flex:0 0 auto;font-family:var(--mono);font-size:12px;padding:7px 12px;border:1.5px solid var(--line);background:var(--card);border-radius:4px;cursor:pointer;color:var(--ink);text-align:center;line-height:1.35}
.date-chip small{display:block;font-size:10px;color:var(--ink-soft)}
.date-chip.active{border-color:var(--shu);box-shadow:0 0 0 1px var(--shu);font-weight:600}
.date-chip.sat small{color:var(--lake)} .date-chip.sun small{color:var(--shu)}

/* ---------- search & filters ---------- */
.filters{margin:12px 0 2px}
.filters input{font-family:var(--gothic);font-size:13px;padding:7px 12px;border:1.5px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);width:min(100%,280px)}
.filters input:focus{outline:2px solid var(--lake);outline-offset:1px}
.f-chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:thin}
.f-chip{flex:0 0 auto;font-family:var(--mono);font-size:11px;padding:5px 10px;border:1.5px solid var(--line);background:var(--card);border-radius:4px;cursor:pointer;color:var(--ink)}
.f-chip.active{background:var(--pine);border-color:var(--pine);color:#fff}
.f-chip.ga.active{background:var(--grade-a);border-color:var(--grade-a);color:#fff}
.f-chip.gb.active{background:var(--grade-b);border-color:var(--grade-b);color:#fff}
.f-chip.trip.active{background:var(--lake);border-color:var(--lake);color:#fff}
.f-sep{flex:0 0 1px;background:var(--line);margin:3px 2px}
.fnote{font-size:11px;color:var(--ink-soft);margin:2px 0 0}
.fcount{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin:8px 0 0}

/* ---------- status / loading ---------- */
.status{font-family:var(--mono);font-size:12px;color:var(--ink-soft);padding:18px 2px}
.status.error{color:var(--shu)}
.status button{font-family:var(--mono);font-size:12px;margin-left:10px;padding:3px 10px;border:1px solid var(--shu);background:none;color:var(--shu);border-radius:3px;cursor:pointer}

/* ---------- mountain cards (by-date view) ---------- */
.cards{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.mcard{display:grid;grid-template-columns:74px 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;cursor:pointer;transition:border-color .15s, transform .15s}
.mcard:hover{border-color:var(--pine);transform:translateY(-1px)}
.mcard:focus-visible{outline:2px solid var(--lake);outline-offset:2px}
.stamp{width:64px;height:64px;border-radius:50%;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mincho);transform:rotate(-6deg);background:radial-gradient(circle, rgba(255,255,255,.6), transparent)}
.stamp .g{font-size:30px;font-weight:800;line-height:1}
.stamp .lbl{font-family:var(--mono);font-size:8px;letter-spacing:.1em;margin-top:1px}
.stamp.a{border-color:var(--grade-a);color:var(--grade-a)}
.stamp.b{border-color:var(--grade-b);color:var(--grade-b)}
.stamp.c{border-color:var(--grade-c);color:var(--grade-c)}
.stamp.na{border-color:var(--line);color:var(--ink-soft)}
.mhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mhead .ja{font-family:var(--mincho);font-weight:700;font-size:22px;letter-spacing:.06em}
.mhead .meta{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.region-chip{font-size:11px;font-weight:500;color:var(--pine);border:1px solid var(--pine);border-radius:3px;padding:0 6px}
.metrics{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-family:var(--mono);font-size:12px}
.metrics span b{font-weight:600}
.metrics .k{color:var(--ink-soft);font-size:10px;display:block;letter-spacing:.06em}
.reasons{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:3px;background:var(--paper-deep);color:var(--ink-soft)}
.tag.warn{background:#F6E3D9;color:var(--shu)}
.tag.season{background:#E4EDE6;color:var(--pine)}
.tag.trip{background:#E3ECF2;color:var(--lake)}
.tag.night{background:#E6E9F3;color:#3B4C7A}
.daycell .nightline{color:#3B4C7A;font-size:10px}
.tag.best{background:transparent;border:1px solid currentColor;font-weight:500}
.metrics small{font-weight:400;color:var(--ink-soft);font-size:10px}
.fav{border:none;background:none;cursor:pointer;font-size:20px;line-height:1;color:var(--ink-soft);padding:2px 4px;margin-left:auto;border-radius:3px}
.fav.on{color:var(--grade-b)}
.fav:hover{color:var(--grade-b)}
.fav:focus-visible{outline:2px solid var(--lake);outline-offset:1px}
.htable tr.hw td{background:rgba(46,75,56,.06)}
.sunline{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin:0 0 8px}

/* ---------- mountain list (by-mountain view) ---------- */
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:10px}
.mlist .mcard{grid-template-columns:1fr;gap:6px}
.region-head{font-family:var(--mincho);font-size:16px;letter-spacing:.1em;border-left:4px solid var(--pine);padding-left:10px;margin:24px 0 2px}
.region-head .area-count{font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:0}

/* ---------- detail view ---------- */
.detail{margin-top:14px}
.back{font-family:var(--mono);font-size:12px;background:none;border:none;color:var(--lake);cursor:pointer;padding:6px 0;text-decoration:underline}
.dhead{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px}
.dhead .ja{font-family:var(--mincho);font-weight:800;font-size:clamp(28px,5vw,38px);letter-spacing:.08em}
.dhead .sub{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:2px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.daycell{flex:0 0 auto;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:9px 10px;font-family:var(--mono);font-size:11px;line-height:1.7;cursor:pointer;transition:border-color .15s}
.daycell:hover{border-color:var(--pine)}
.daycell.sel{border-color:var(--shu);box-shadow:0 0 0 1px var(--shu)}
.daycell .d{font-weight:600}
.daycell .gd{font-family:var(--mincho);font-weight:800;font-size:18px}
.daycell .gd.a{color:var(--grade-a)} .daycell .gd.b{color:var(--grade-b)} .daycell .gd.c{color:var(--grade-c)}
.daycell .warnline{color:var(--shu);font-size:10px}

/* ---------- hourly panel ---------- */
.hourly{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:14px 16px;margin:8px 0 4px;overflow-x:auto}
.hourly h4{font-family:var(--mincho);font-size:14px;letter-spacing:.08em;margin-bottom:8px}
.hourly .reasons{margin:0 0 8px}
.htable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px;background:none}
.htable th,.htable td{border:none;border-bottom:1px solid var(--paper-deep);padding:2px 8px;text-align:right;background:none;white-space:nowrap}
.htable th{color:var(--ink-soft);font-weight:500;font-size:10px;letter-spacing:.06em}
.htable td.hl,.htable th.hl{text-align:left}
.hbar{display:inline-block;height:8px;background:var(--lake);border-radius:2px;vertical-align:middle;margin-left:4px}
.om-note{font-size:11px;color:var(--ink-soft);margin-top:8px;font-family:var(--mono)}

section.block{margin:26px 0}
.block h3{font-family:var(--mincho);font-size:17px;letter-spacing:.1em;border-left:4px solid var(--shu);padding-left:10px;margin-bottom:10px}
.block .note{font-size:12px;color:var(--ink-soft);margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--paper-deep);font-weight:700;font-size:12px}
td.mono, .mono{font-family:var(--mono);font-size:12px}
.season-bar{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:6px 0 10px}
.season-bar .mcell{text-align:center;font-family:var(--mono);font-size:10px;padding:6px 0;border-radius:3px;background:var(--paper-deep);color:var(--ink-soft)}
.season-bar .mcell.best{background:var(--pine);color:#fff}
.season-bar .mcell.now{outline:2px solid var(--shu)}
.snotes{font-size:13px}
.snotes li{margin:4px 0 4px 18px}
.route-card{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.route-card:hover{border-color:var(--pine)}
.route-card:focus-visible{outline:2px solid var(--lake);outline-offset:2px}
.route-card .rname{font-weight:700}
.route-card .rstats{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:2px}
.route-card .ropen{font-family:var(--mono);font-size:11px;color:var(--lake);margin-top:6px}
.rgrades{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.gchip{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:1px 7px;color:var(--ink-soft);background:var(--card)}
.gchip.official{border-color:var(--pine);color:var(--pine)}
.gchip.est{border-style:dashed}
.stars{color:var(--shu);font-size:12px;letter-spacing:.12em}
.grade-src{font-size:11px;color:var(--ink-soft)}
a{color:var(--lake)}
.sample-flag{font-family:var(--mono);font-size:10px;color:var(--shu);letter-spacing:.08em}
.verified-flag{font-family:var(--mono);font-size:10px;color:var(--pine);letter-spacing:.08em}

/* ---------- map view ---------- */
#map{height:min(70vh,640px);min-height:420px;background:var(--paper-deep);border:1px solid var(--line);border-radius:6px}
.leaflet-container{font-family:var(--gothic)}
.map-popup .ja{font-family:var(--mincho);font-weight:700;font-size:15px}
.map-popup .gd{font-family:var(--mincho);font-weight:800;font-size:16px;margin-left:4px}
.map-popup .sub{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin:2px 0 4px}
.map-popup a{font-size:12px}

/* ---------- footer ---------- */
footer{margin-top:48px;border-top:1px solid var(--line);padding-top:14px;font-size:11px;color:var(--ink-soft);line-height:1.8}

@media (max-width:560px){
  .mcard{grid-template-columns:58px 1fr;padding:13px 14px}
  .stamp{width:52px;height:52px}.stamp .g{font-size:24px}
  .metrics{gap:12px}
}
@media (prefers-reduced-motion: reduce){
  .mcard{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>山日和</h1>
      <span class="romaji">Yamabiyori · Japan Hiking Planner</span>
      <span class="proto-chip">PROTOTYPE v0.3</span>
    </div>
    <button id="langBtn" class="lang-btn" type="button">EN</button>
    <p class="tagline" id="tagline">日付から山を選ぶ、山から日を選ぶ。風・雨・凍結高度から独自に算出した登山指数と、登山口までの交通・山小屋・季節情報。</p>
  </header>

  <div class="controls">
    <div class="view-toggle" role="tablist">
      <button id="tab-date" class="active" role="tab" aria-selected="true">日付から探す</button>
      <button id="tab-mtn" role="tab" aria-selected="false">山から探す</button>
      <button id="tab-map" role="tab" aria-selected="false">地図から探す</button>
    </div>
    <div class="date-row" id="dateRow"></div>
  </div>

  <div class="filters" id="filters">
    <input id="q" type="search" placeholder="山名・山域・県名で検索" aria-label="山を検索">
    <div class="f-chips" id="fchips"></div>
    <p class="fnote" id="fnote"></p>
  </div>

  <div id="status" class="status">Open-Meteo から予報を取得中…</div>
  <main id="main"></main>

  <footer id="footer"></footer>
</div>
<script src="data/mountains.js"></script>
<script>
/* Mountain data lives in data/mountains.js (the MOUNTAINS array),
   loaded by the script tag above. Edit that file to add mountains. */

/* ============================================================
   LANGUAGE — UI strings in Japanese and English. Mountain data
   (notes, timetables, huts, routes) is Japanese-only; the English
   UI says so on the pages that show it.
   ============================================================ */
const LANG_KEY="yb-lang", FAV_KEY="yb-fav";
function initialLang(){
  try{ const s=localStorage.getItem(LANG_KEY); if(s==="ja"||s==="en") return s; }catch(e){}
  return (navigator.language||"ja").toLowerCase().indexOf("ja")===0?"ja":"en";
}

const STR={
  ja:{
    tagline:"日付から山を選ぶ、山から日を選ぶ。風・雨・凍結高度から独自に算出した登山指数と、登山口までの交通・山小屋・季節情報。",
    langBtn:"EN", langLabel:"Switch to English",
    tabDate:"日付から探す", tabMtn:"山から探す", tabMap:"地図から探す",
    search:"山名・山域・県名で検索", searchLabel:"山を検索",
    today:"今日",
    chipA:"A判定", chipB:"B判定", chipHy:"百名山",
    chipTokyo:"🚆 東京から日帰り", chipHut:"🛖 山小屋泊", chipCar:"🚗 車・タクシー",
    tipTokyo:"都心（新宿・東京駅）を朝出発し、公共交通だけで当日中に往復できる目安の山（独自判断）",
    tipHut:"標準的な計画で山小屋（またはテント）1泊以上が前提の山（独自判断）",
    tipCar:"どの登山口にも実用的な路線バス・鉄道がなく、レンタカーかタクシーが必要な山（独自判断）",
    tipA:"A判定の山を表示", tipB:"B判定の山を表示",
    chipFav:"★ お気に入り", tipFav:"☆で登録した山だけを表示（このブラウザに保存）",
    favOn:"お気に入りに追加", favOff:"お気に入りから外す",
    favEmpty:"お気に入りはまだありません。山のカードの ☆ をタップすると登録できます。",
    badgeTokyo:"🚆 東京から日帰り", badgeHut:"🛖 山小屋泊", badgeCar:"🚗 車・タクシー",
    loading:(h,n)=>"Open-Meteo から予報を取得中…（"+h+"/"+n+"山）",
    loadFailAll:"予報の取得に失敗しました（インターネット接続を確認してください）。グレードは「—」表示ですが、交通・山小屋・ルート情報は閲覧できます。",
    loadFailSome:n=>"⚠ "+n+"山の予報を取得できませんでした（グレードは「—」表示）。",
    retry:"再試行", retryFailed:"失敗分を再試行",
    fcount:(n,N)=>n+" / "+N+"山", none:"条件に合う山が見つかりません。",
    kWind:"最大風速（日中）", kPrecip:"降水（日中）", kTemp:"気温", kFrz:"凍結高度", total24:p=>"（終日 "+p+"）",
    hyaku:"百名山", hyakuLong:"日本百名山", elev:"標高",
    best:"ベスト", month:n=>n+"月",
    wStrong:(w,g)=>"強風 "+w+"m/s（突風"+g+"）", wBreezy:w=>"やや風 "+w+"m/s", wCalm:w=>"風 "+w+"m/s",

/* One batched Open-Meteo URL for a LIST of mountains — comma-separated
   coordinates; the API answers with an array of results in the same order. */
function omBatchUrl(list){
  const p = new URLSearchParams({
    latitude:list.map(m=>m.coords.lat).join(","),
    longitude:list.map(m=>m.coords.lon).join(","),
    elevation:list.map(m=>m.forecast_elevation).join(","),
    daily:"temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,wind_speed_10m_max,wind_gusts_10m_max,sunrise,sunset,daylight_duration",
    hourly:"freezing_level_height,temperature_2m,precipitation,wind_speed_10m,wind_gusts_10m,weather_code,cape",
    timezone:"Asia/Tokyo", wind_speed_unit:"ms", forecast_days:"7"
  });
  return "https://api.open-meteo.com/v1/forecast?" + p.toString();
}

/* Open-Meteo occasionally returns null for a value — every number display
   goes through fmt() so one null can never crash a render. */
const fmt=(v,dg)=>v==null?"—":v.toFixed(dg||0);

function fetchWithTimeout(url,ms){
  const ctl=new AbortController();
  const tm=setTimeout(()=>ctl.abort(),ms);
  return fetch(url,{signal:ctl.signal}).finally(()=>clearTimeout(tm));
}

/* Link to Open-Meteo's own chart page for this mountain (raw source). */
function omSiteUrl(m){
  return "https://open-meteo.com/en/docs#latitude="+m.coords.lat+"&longitude="+m.coords.lon
    +"&elevation="+m.forecast_elevation
    +"&hourly=temperature_2m,precipitation,wind_speed_10m,wind_gusts_10m,freezing_level_height"
    +"&timezone=Asia%2FTokyo&wind_speed_unit=ms&forecast_days=7";
}

/* One Open-Meteo result → our per-day structure. */
function processOm(data){
  const H = data.hourly;
  return data.daily.time.map((tm,d)=>{
    const s=d*24;
    const fl = H.freezing_level_height.slice(s,s+24).filter(v=>v!=null);
    return {
      date:tm,
      tmax:data.daily.temperature_2m_max[d], tmin:data.daily.temperature_2m_min[d],
      precip:data.daily.precipitation_sum[d], snow:data.daily.snowfall_sum[d],
      wind:data.daily.wind_speed_10m_max[d], gust:data.daily.wind_gusts_10m_max[d],
      frzMin: fl.length ? Math.round(Math.min(...fl)) : null,
      sunrise:(data.daily.sunrise[d]||"").slice(11,16), sunset:(data.daily.sunset[d]||"").slice(11,16),
      daylight:data.daily.daylight_duration[d],
      hours: H.time.slice(s,s+24).map((ht,j)=>({
        t:ht.slice(11,16),
        temp:H.temperature_2m[s+j], pr:H.precipitation[s+j],
        wind:H.wind_speed_10m[s+j], gust:H.wind_gusts_10m[s+j],
        code:H.weather_code[s+j], fl:H.freezing_level_height[s+j], cape:H.cape[s+j]
      }))
    };
  });
}

/* sessionStorage cache — a reload within 45 min (same calendar day) costs zero API calls. */
const WX_CACHE_KEY="yb-wx-v3", WX_TTL_MIN=45;  // v3: hours gained CAPE, days gained sunrise/sunset/daylight
function readWxCache(){
  try{
    const c=JSON.parse(sessionStorage.getItem(WX_CACHE_KEY));
    if(!c||!c.savedAt||!c.wx) return null;
    if(Date.now()-c.savedAt>WX_TTL_MIN*60*1000) return null;
    if(new Date(c.savedAt).toDateString()!==new Date().toDateString()) return null;
    return c;
  }catch(e){ return null; }
}
function saveWxCache(){
  try{ sessionStorage.setItem(WX_CACHE_KEY,JSON.stringify({savedAt:Date.now(), wx:state.wx})); }
  catch(e){ /* storage full or blocked — cache is best-effort */ }
}

/* Fetch weather for every mountain not yet in state.wx, ~30 mountains per
   request. A failed request only loses its own mountains — everything else
   still renders, and 再試行 refetches just what's missing. */
const WX_CHUNK=30;
async function loadMissing(){
  if(state.fetching) return;
  state.fetching=true;
  const st=document.getElementById("status");
  const missing=MOUNTAINS.filter(m=>!state.wx[m.id]);
  if(missing.length){
    st.className="status";
    st.textContent=t("loading",MOUNTAINS.length-missing.length,MOUNTAINS.length);
    const chunks=[];
    for(let i=0;i<missing.length;i+=WX_CHUNK) chunks.push(missing.slice(i,i+WX_CHUNK));
    await Promise.allSettled(chunks.map(list=>
      fetchWithTimeout(omBatchUrl(list),12000)
        .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
        .then(data=>{
          const arr=Array.isArray(data)?data:[data]; // a 1-mountain chunk comes back as a bare object
          if(arr.length!==list.length) throw new Error("result length mismatch");
          arr.forEach((res,i)=>{ if(res&&res.daily&&res.hourly) state.wx[list[i].id]=processOm(res); });
          const have=MOUNTAINS.filter(m=>state.wx[m.id]).length;
          st.textContent=t("loading",have,MOUNTAINS.length);
        })
    ));
  }
  state.fetching=false;
  finalizeWx();
}

/* Next 7 dates starting today — lets the site render even with no forecast at all. */
function fallbackDates(){
  const out=[], base=new Date();
  for(let i=0;i<7;i++){
    const dt=new Date(base.getFullYear(),base.getMonth(),base.getDate()+i);
    out.push(dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"));
  }
  return out;
}

function renderStatus(){
  const st=document.getElementById("status");
  if(!state.loaded) return;
  const fail=MOUNTAINS.length-MOUNTAINS.filter(m=>state.wx[m.id]).length;
  if(state.error){
    st.className="status error";
    st.innerHTML=t("loadFailAll")+"<button onclick=\"loadMissing()\">"+t("retry")+"</button>";
  }else if(fail){
    st.className="status error";
    st.innerHTML=t("loadFailSome",fail)+"<button onclick=\"loadMissing()\">"+t("retryFailed")+"</button>";
  }else{
    st.className="status"; st.textContent="";
  }
}

function finalizeWx(){
  const ok=MOUNTAINS.filter(m=>state.wx[m.id]);
  if(ok.length){ state.dates=state.wx[ok[0].id].map(d=>d.date); saveWxCache(); }
  else state.dates=fallbackDates(); // weather fully unavailable — static content still renders
  state.loaded=true; state.error=!ok.length;
  renderStatus();
  applyHash();  // honors a pasted #/m/<id> link on first load; re-renders in place afterwards
}

function loadAll(){

  if(c) state.wx=c.wx;
  loadMissing();
}

/* Defaults for the OPTIONAL per-mountain grading knobs. A mountain that sets
   grading.snow_caution / snow_danger (cm/day), cold_warn (℃), freeze_buffer (m) or cape_warn (J/kg)
   overrides these — tune in data/mountains.js per mountain, not here. */
const GRADE_DEFAULTS={snow_caution:0.5, snow_danger:5, cold_warn:-10, freeze_buffer:300, cape_warn:1000};

/* Hiking hours: wind, rain and thunder are graded on 05:00–16:59 only.
   Snowfall, freezing level and the overnight low still use the whole day. */
const DAY_FROM=5, DAY_TO=17;
function hikeWindow(d){
  if(!d.hours||d.hours.length<DAY_TO) return {pr:d.precip, night:0, wind:d.wind, gust:d.gust, capeMax:null, thunderAt:null, wet:d.precip>0};
  let pr=0, night=0, wind=null, gust=null, capeMax=null, thunderAt=null, wet=false;
  d.hours.forEach((h,i)=>{
    if(i<DAY_FROM||i>=DAY_TO){ night+=h.pr||0; return; }
    pr+=h.pr||0;
    if((h.pr||0)>=0.1) wet=true;
    if(h.wind!=null) wind=Math.max(wind||0,h.wind);
    if(h.gust!=null) gust=Math.max(gust||0,h.gust);
    if(h.cape!=null) capeMax=Math.max(capeMax||0,h.cape);
    if(h.code>=95&&thunderAt==null) thunderAt=h.t;   // WMO 95–99 = thunderstorm
  });
  return {pr, night, wind, gust, capeMax, thunderAt, wet};
}

/* Grade one day for one mountain.
   Returns {g:'A'|'B'|'C', reasons:[], warns:[], night:mm|null, dayPr, dayWind} —
   night = overnight rain worth mentioning because the hiking hours stay dry enough. */
function gradeDay(m,d){
  const G=m.grading; let lv=0; const reasons=[], warns=[];
  const snowCa=G.snow_caution!=null?G.snow_caution:GRADE_DEFAULTS.snow_caution;
  const snowDa=G.snow_danger!=null?G.snow_danger:GRADE_DEFAULTS.snow_danger;
  const coldW=G.cold_warn!=null?G.cold_warn:GRADE_DEFAULTS.cold_warn;
  const frzBuf=G.freeze_buffer!=null?G.freeze_buffer:GRADE_DEFAULTS.freeze_buffer;
  const capeW=G.cape_warn!=null?G.cape_warn:GRADE_DEFAULTS.cape_warn;
  const w=hikeWindow(d);
  // wind — per-mountain thresholds, so a breezy-but-fine day is NOT auto-C
  if(w.wind>=G.wind_danger){ lv=2; warns.push(t("wStrong",fmt(w.wind),fmt(w.gust))); }
  else if(w.wind>=G.wind_caution){ lv=Math.max(lv,1); reasons.push(t("wBreezy",fmt(w.wind))); }
  else reasons.push(t("wCalm",fmt(w.wind)));
  // rain during hiking hours
  if(w.pr>=G.precip_danger){ lv=2; warns.push(t("pHeavy",fmt(w.pr))); }
  else if(w.pr>=G.precip_caution){ lv=Math.max(lv,1); reasons.push(t("pLight",fmt(w.pr,1))); }
  // rain outside hiking hours: a heavy 24h total → swollen streams / muddy trail (B); moderate → just noted
  let night=null;
  if(w.pr<G.precip_danger&&(w.night>=G.precip_danger||(d.precip!=null&&d.precip>=G.precip_danger))){ lv=Math.max(lv,1); warns.push(t("nightHeavy",fmt(d.precip!=null?d.precip:w.pr+w.night))); }
  else if(w.night>=G.precip_caution&&w.pr<G.precip_caution) night=w.night;
  // thunder — the model's own thunderstorm code, or unstable air (CAPE) with some rain around
  if(w.thunderAt){ lv=Math.max(lv,1); warns.push(t("thunderCode",w.thunderAt)); }
  else if(w.capeMax!=null&&w.capeMax>=capeW&&w.wet){ lv=Math.max(lv,1); warns.push(t("thunderCape",Math.round(w.capeMax))); }
  // fresh snowfall
  if(d.snow>=snowDa){ lv=2; warns.push(t("sHeavy",fmt(d.snow))); }
  else if(d.snow>=snowCa){ lv=Math.max(lv,1); warns.push(t("sLight")); }
  // seasonality-aware freeze check — this is what てんくら misses
  const month = new Date(d.date+"T00:00:00").getMonth()+1;
  if(G.snow_months.includes(month) && d.frzMin!=null && d.frzMin < G.ridgeline+frzBuf){
    lv=Math.max(lv,1);
    warns.push(t("frz",d.frzMin,G.ridgeline));
  }
  if(d.tmin<=coldW){ lv=Math.max(lv,1); warns.push(t("cold",fmt(d.tmin))); }
  return { g:["A","B","C"][lv], reasons, warns, night, dayPr:w.pr, dayWind:w.wind };
}

/* ============================================================
   RENDERING
   ============================================================ */
const main = document.getElementById("main");
const fmtDate = s => { const dt=new Date(s+"T00:00:00"); return (dt.getMonth()+1)+"/"+dt.getDate(); };
const youbi = s => (isEN()?["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]:"日月火水木金土".split(""))[new Date(s+"T00:00:00").getDay()];
const dayLabel = s => isEN()? youbi(s)+" "+fmtDate(s) : fmtDate(s)+"（"+youbi(s)+"）";

/* Display order for the 13 areas (north→south) — must match the canonical list
   in data/mountains.js's template comment and _agentwork/validate_mountains.js. */
const AREA_ORDER=["北海道","東北","上信越・尾瀬","関東周辺","奥秩父・奥多摩","八ヶ岳・中信高原","北アルプス・御嶽","中央アルプス","南アルプス","富士・伊豆・箱根","北陸・近畿","中国・四国","九州・屋久島"];
const TRIP_KEYS=[["tokyo_day","Tokyo"],["hut","Hut"],["car","Car"]];   // data key → string-key suffix

/* Mountains matching the current search text + area / 百名山 / trip filters. */
function filteredMountains(){
  let list=MOUNTAINS;
  const q=state.q;
  if(q){
    const ql=q.toLowerCase();
    list=list.filter(m=>m.name_ja.indexOf(q)>=0 || m.name_en.toLowerCase().indexOf(ql)>=0
      || m.id.indexOf(ql)>=0 || m.region.indexOf(q)>=0 || m.prefecture.indexOf(q)>=0
      || (AREA_EN[m.area]||"").toLowerCase().indexOf(ql)>=0 || prefNameEN(m.prefecture).indexOf(ql)>=0);
  }
  if(state.fArea) list=list.filter(m=>m.area===state.fArea);
  if(state.fHyaku) list=list.filter(m=>m.hyakumeizan);
  TRIP_KEYS.forEach(([k])=>{ if(state.fTrip[k]) list=list.filter(m=>m.trip&&m.trip[k]); });
  if(state.fFav) list=list.filter(m=>state.favs.indexOf(m.id)>=0);
  return list;
}
const prefNameEN=p=>p.split("・").map(x=>x.replace(/[^（）]+/g,w=>PREF_EN[w]||w)).join(" ").toLowerCase();

/* Grade filter: no grade chip on = all grades; otherwise only the selected ones. */
function gradeFilter(list){
  const sel=["A","B"].filter(g=>state.fGrades[g]);
  return sel.length? list.filter(x=>sel.indexOf(x.gr.g)>=0) : list;
}

/* Filter bar is built ONCE (rebuilding it on render would break IME input focus);
   labels are (re)applied by labelFilterChips() when the language changes. */
function buildFilterChips(){
  const box=document.getElementById("fchips");
  const mk=(id,cls)=>{const b=document.createElement("button");b.type="button";b.className="f-chip"+(cls?" "+cls:"");b.id=id;box.appendChild(b);return b;};
  const sep=cls=>{const s=document.createElement("span");s.className="f-sep"+(cls?" "+cls:"");box.appendChild(s);};
  mk("chip-ga","ga").onclick=()=>{state.fGrades.A=!state.fGrades.A; render();};
  mk("chip-gb","gb").onclick=()=>{state.fGrades.B=!state.fGrades.B; render();};
  sep("sep-grade");
  TRIP_KEYS.forEach(([k])=>{ mk("chip-"+k,"trip").onclick=()=>{state.fTrip[k]=!state.fTrip[k]; render();}; });
  sep();
  mk("chip-fav").onclick=()=>{state.fFav=!state.fFav; render();};
  mk("chip-hy").onclick=()=>{state.fHyaku=!state.fHyaku; render();};
  AREA_ORDER.forEach(a=>{
    const b=mk("area-"+AREA_ORDER.indexOf(a)); b.dataset.area=a;
    b.onclick=()=>{state.fArea=(state.fArea===a?null:a); render();};
  });
  const q=document.getElementById("q");
  let composing=false;   // don't filter mid-IME-composition (kana would flash empty results)
  q.addEventListener("compositionstart",()=>composing=true);
  q.addEventListener("compositionend",()=>{composing=false; state.q=q.value.trim(); render();});
  q.addEventListener("input",()=>{ if(!composing){ state.q=q.value.trim(); render(); } });
  labelFilterChips();
}
function labelFilterChips(){
  const set=(id,txt,tip)=>{const b=document.getElementById(id); b.textContent=txt; if(tip) b.title=tip;};
  set("chip-ga",t("chipA"),t("tipA")); set("chip-gb",t("chipB"),t("tipB"));
  TRIP_KEYS.forEach(([k,s])=>set("chip-"+k,t("chip"+s),t("tip"+s)));
  set("chip-fav",t("chipFav"),t("tipFav"));
  set("chip-hy",t("chipHy"));
  document.querySelectorAll("#fchips .f-chip[data-area]").forEach(b=>{ b.textContent=areaName(b.dataset.area); });
  const q=document.getElementById("q"); q.placeholder=t("search"); q.setAttribute("aria-label",t("searchLabel"));
}

function syncFilters(){
  const onList=state.view==="date"||state.view==="mtn"||state.view==="map";
  document.getElementById("filters").style.display=onList?"":"none";
  const gradeVisible=state.view==="date"||state.view==="map";
  document.getElementById("chip-ga").style.display=gradeVisible?"":"none";
  document.getElementById("chip-gb").style.display=gradeVisible?"":"none";
  document.querySelector(".f-sep.sep-grade").style.display=gradeVisible?"":"none";
  document.getElementById("chip-ga").classList.toggle("active",state.fGrades.A);
  document.getElementById("chip-gb").classList.toggle("active",state.fGrades.B);
  TRIP_KEYS.forEach(([k])=>document.getElementById("chip-"+k).classList.toggle("active",state.fTrip[k]));
  document.getElementById("chip-hy").classList.toggle("active",state.fHyaku);
  document.getElementById("chip-fav").classList.toggle("active",state.fFav);
  document.querySelectorAll("#fchips .f-chip[data-area]").forEach(b=>b.classList.toggle("active",state.fArea===b.dataset.area));
  // explain what an active trip chip means (its criteria are our own judgment)
  const notes=TRIP_KEYS.filter(([k])=>state.fTrip[k]).map(([,s])=>t("tip"+s));
  document.getElementById("fnote").textContent=notes.join(" ／ ");
}

/* Small badges for the trip flags (cards, detail page). */
function tripBadges(m){
  if(!m.trip) return "";
  return TRIP_KEYS.filter(([k])=>m.trip[k]).map(([,s])=>'<span class="tag trip" title="'+t("tip"+s)+'">'+t("badge"+s)+'</span>').join("");
}
function nightTag(gr,short){
  return gr&&gr.night!=null?'<span class="tag night">'+(short?t("nightShort"):t("night",fmt(gr.night,1),fmt(gr.dayPr,1)))+'</span>':"";
}
/* ☆/★ toggle — a real button, so it must not trigger the card it sits on. */
function favBtn(m){
  const on=state.favs.indexOf(m.id)>=0, lbl=t(on?"favOff":"favOn");
  return '<button type="button" class="fav'+(on?' on':'')+'" data-fav="'+m.id+'" aria-pressed="'+on+'" title="'+lbl+'" aria-label="'+lbl+'">'+(on?"★":"☆")+'</button>';
}
function wireCards(){
  main.querySelectorAll(".fav").forEach(b=>{ b.onclick=e=>{ e.stopPropagation(); toggleFav(b.dataset.fav); }; });
  main.querySelectorAll(".mcard").forEach(c=>{
    const open=()=>openDetail(c.dataset.id);
    c.onclick=open; c.onkeydown=e=>{ if(e.target!==c) return; if(e.key==="Enter"||e.key===" "){e.preventDefault();open();} };
  });
}
/* The week's best day for one mountain: lowest grade, earliest date on ties. */
function bestDay(m){
  const wd=state.wx[m.id]; if(!wd) return null;
  let best=null;
  wd.forEach(d=>{ const g=gradeDay(m,d).g, r="ABC".indexOf(g); if(!best||r<best.r) best={r,g,date:d.date}; });
  return best;
}
function bestTag(m){
  const b=bestDay(m); if(!b) return "";
  return '<span class="tag best" style="color:'+gradeColor(b.g)+'">'+t("bestWeek",dayLabel(b.date),b.g)+'</span>';
}
const emptyMsg=()=>'<p class="status">'+(state.fFav&&!state.favs.length?t("favEmpty"):t("none"))+'</p>';

/* ---------- map view (Leaflet + 地理院タイル) ---------- */
let lmap=null, lmarkers=null, mapPos=null;   // mapPos keeps zoom/center across re-renders
function gradeColor(g){ return g==="A"?"#2E7D4F":g==="B"?"#C08A2D":g==="C"?"#C2452F":"#5B6660"; }
function renderMap(){
  main.innerHTML='<div class="detail" style="margin-top:14px"><div id="map"></div>'
    +'<p class="note" style="margin-top:8px">'+t("mapNote",state.dates[state.dayIndex]?fmtDate(state.dates[state.dayIndex]):'—')+'</p></div>';
  if(typeof L==="undefined"){
    document.getElementById("map").innerHTML='<p class="status error" style="padding:20px">'+t("mapFail")+'</p>';
    return;
  }
  if(lmap){ mapPos={center:lmap.getCenter(), zoom:lmap.getZoom()}; lmap.remove(); lmap=null; }
  lmap=L.map("map");
  if(mapPos) lmap.setView(mapPos.center, mapPos.zoom);
  else lmap.setView([38.2,137.6],5);
  L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",{
    attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">'+(isEN()?"GSI Japan":"国土地理院")+'</a>',
    maxZoom:18
  }).addTo(lmap);
  lmarkers=L.layerGroup().addTo(lmap);
  const list=gradeFilter(filteredMountains().map(m=>{
    const wd=state.wx[m.id];
    const d=wd?wd[state.dayIndex]:null;
    const gr=d?gradeDay(m,d):{g:null,reasons:[],warns:[],night:null};
    return {m,gr};
  }));
  list.forEach(({m,gr})=>{
    const mk=L.circleMarker([m.coords.lat,m.coords.lon],{
      radius:8, color:"#26302A", weight:1, fillColor:gradeColor(gr.g), fillOpacity:.85
    });
    mk.bindPopup('<div class="map-popup"><span class="ja">'+m.name_ja+'</span><span class="gd" style="color:'+gradeColor(gr.g)+'">'+(gr.g||'—')+'</span>'
      +(isEN()?'<div class="sub">'+m.name_en+'</div>':'')
      +'<div class="sub">'+regionLabel(m)+' · '+m.elevation+'m'+(m.hyakumeizan?' · '+t("hyaku"):'')+'</div>'
      +(gr.warns.length?'<div class="sub" style="color:#C2452F">⚠ '+gr.warns[0]+'</div>':'')
      +(gr.night!=null?'<div class="sub" style="color:#3B4C7A">'+t("night",fmt(gr.night,1),fmt(gr.dayPr,1))+'</div>':'')
      +'<a href="#/m/'+m.id+'">'+t("toDetail")+'</a></div>');
    mk.addTo(lmarkers);
  });
  // zoom to results when the FILTER SELECTION changed (not on date/grade flips).
  // fitBounds must run AFTER invalidateSize — the container was inserted this tick.
  const tripSig=TRIP_KEYS.map(([k])=>state.fTrip[k]?1:0).join("");
  const sig=(state.q||"")+"|"+(state.fArea||"")+"|"+(state.fHyaku?1:0)+"|"+tripSig;
  const anyFilter=state.q||state.fArea||state.fHyaku||tripSig.indexOf("1")>=0;
  const fitTo=(sig!==state.mapSig && anyFilter && list.length)
    ? L.latLngBounds(list.map(x=>[x.m.coords.lat,x.m.coords.lon])).pad(0.2) : null;
  state.mapSig=sig;
  setTimeout(()=>{ if(!lmap) return; lmap.invalidateSize(); if(fitTo) lmap.fitBounds(fitTo,{maxZoom:10}); },0);
}

/* Hash routing: #/d/<day> | #/mtn | #/map | #/m/<id> | #/m/<id>/r/<n>.
   Links survive reload, and browser Back/Forward navigate the views. */
function applyHash(){
  const old=state.view;
  const parts=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  if(parts[0]==="m"&&parts[1]){
    const m=MOUNTAINS.find(x=>x.id===parts[1]);
    if(!m){ location.replace("#/d/"+state.dayIndex); return; }
    state.selected=m.id;
    if(parts[2]==="r"&&m.routes[+parts[3]]){ state.view="route"; state.routeIdx=+parts[3]; }
    else{ state.view="detail"; if(old!=="detail"&&old!=="route") state.hourIdx=state.dayIndex; }
    if(old==="date"||old==="mtn"||old==="map") state.prevView=old;
  }else if(parts[0]==="mtn"){ state.view="mtn"; state.prevView="mtn"; }
  else if(parts[0]==="map"){ state.view="map"; state.prevView="map"; }
  else{
    state.view="date"; state.prevView="date";
    if(parts[0]==="d"){ const i=parseInt(parts[1],10); if(i>=0&&i<state.dates.length) state.dayIndex=i; }
  }
  const wasList=old==="date"||old==="mtn"||old==="map", isList=state.view==="date"||state.view==="mtn"||state.view==="map";
  if(old!==state.view&&!(wasList&&isList)) window.scrollTo({top:0});
  buildDateChips(); render();
}

function setTitle(){
  let tt=t("tDate");
  if(state.view==="mtn") tt=t("tMtn");
  else if(state.view==="map") tt=t("tMap");
  else if(state.view==="detail"||state.view==="route"){
    const m=MOUNTAINS.find(x=>x.id===state.selected);
    if(m) tt=(state.view==="route"&&m.routes[state.routeIdx]) ? t("tRoute",m.routes[state.routeIdx],m) : t("tMount",m);
  }
  document.title=tt;
}

function buildDateChips(){
  const row=document.getElementById("dateRow"); row.innerHTML="";
  state.dates.forEach((d,i)=>{
    const b=document.createElement("button");
    const w=new Date(d+"T00:00:00").getDay();
    b.className="date-chip"+(i===state.dayIndex?" active":"")+(w===6?" sat":w===0?" sun":"");
    b.innerHTML=fmtDate(d)+"<small>"+youbi(d)+(i===0?(isEN()?" · ":"・")+t("today"):"")+"</small>";
    b.onclick=()=>{
      if(state.view==="date"){ location.replace("#/d/"+i); }  // replace: day browsing shouldn't pile up history
      else { state.dayIndex=i; if(state.view==="detail") state.hourIdx=i; buildDateChips(); render(); }
    };
    row.appendChild(b);
  });
}

function seasonNoteFor(m, dateStr){
  const month=new Date(dateStr+"T00:00:00").getMonth()+1;
  return m.seasonality.notes[month]||null;
}

function stampHTML(g){ // g=null → grey 「—」 stamp (weather unavailable)
  return '<div class="stamp '+(g?g.toLowerCase():'na')+'"><span class="g">'+(g||'—')+'</span><span class="lbl">YAMABIYORI</span></div>';
}

function openDetail(id){ location.hash="#/m/"+id; }
const nameHTML=m=>'<span class="ja">'+m.name_ja+'</span>'+(isEN()?' <span class="en-name">'+m.name_en+'</span>':'');

function renderByDate(){
  const dateStr=state.dates[state.dayIndex];
  const ranked=gradeFilter(filteredMountains().map(m=>{
    const wd=state.wx[m.id];
    const d=wd?wd[state.dayIndex]:null;
    const gr=d?gradeDay(m,d):{g:null,reasons:[],warns:[],night:null};
    return {m,d,gr,score:d?["A","B","C"].indexOf(gr.g)*100+(gr.dayWind||0):9999};
  }).sort((a,b)=>a.score-b.score));

  let html=ranked.length<MOUNTAINS.length?'<p class="fcount">'+t("fcount",ranked.length,MOUNTAINS.length)+'</p>':'';
  if(!ranked.length){ main.innerHTML=html+emptyMsg(); return; }
  html+='<div class="cards">';
  ranked.forEach(({m,d,gr})=>{
    const season=isEN()?null:seasonNoteFor(m,dateStr);
    html+='<article class="mcard" tabindex="0" data-id="'+m.id+'">'
      +stampHTML(gr.g)
      +'<div><div class="mhead">'+nameHTML(m)
      +'<span class="region-chip">'+regionLabel(m)+'</span>'
      +'<span class="meta">'+m.elevation+'m'+(m.hyakumeizan?' · '+t("hyaku"):'')+'</span>'+favBtn(m)+'</div>'
      +'<div class="metrics">'
      +'<span><span class="k">'+t("kWind")+'</span><b>'+(d?fmt(gr.dayWind)+' m/s':'—')+'</b></span>'
      +'<span><span class="k">'+t("kPrecip")+'</span><b>'+(d?fmt(gr.dayPr,1)+' mm'+(d.precip!=null&&Math.abs(d.precip-gr.dayPr)>=0.1?'<small>'+t("total24",fmt(d.precip,1))+'</small>':''):'—')+'</b></span>'
      +'<span><span class="k">'+t("kTemp")+'</span><b>'+(d?fmt(d.tmin)+' / '+fmt(d.tmax)+'℃':'—')+'</b></span>'
      +'<span><span class="k">'+t("kFrz")+'</span><b>'+(d&&d.frzMin!=null?d.frzMin+' m':'—')+'</b></span>'
      +'</div><div class="reasons">'
      +nightTag(gr)
      +gr.warns.map(w=>'<span class="tag warn">⚠ '+w+'</span>').join("")
      +(season?'<span class="tag season">🌸 '+season+'</span>':"")
      +tripBadges(m)
      +'</div></div></article>';
  });
  html+='</div>';
  main.innerHTML=html;
  wireCards();
}

function renderMtnList(){
  // group cards by the coarse area (fixed 13, north→south); region stays as the card's sub-label
  const list=filteredMountains();
  let html=list.length<MOUNTAINS.length?'<p class="fcount">'+t("fcount",list.length,MOUNTAINS.length)+'</p>':'';
  if(!list.length){ main.innerHTML=html+emptyMsg(); return; }
  AREA_ORDER.forEach(area=>{
    const group=list.filter(m=>m.area===area);
    if(!group.length) return;
    html+='<h3 class="region-head">'+areaName(area)+' <span class="area-count">（'+group.length+'）</span></h3><div class="mlist">';
    group.forEach(m=>{
      const wd=state.wx[m.id]; const gr=wd?gradeDay(m,wd[state.dayIndex]):{g:null,reasons:[],warns:[],night:null};
      html+='<article class="mcard" tabindex="0" data-id="'+m.id+'">'
        +'<div class="mhead">'+nameHTML(m)+favBtn(m)+stampHTML(gr.g)+'</div>'
        +'<div class="meta mono">'+(isEN()?'':m.region+' · ')+m.elevation+'m · '+prefName(m.prefecture)+'</div>'
        +'<div class="reasons">'+bestTag(m)+'<span class="tag">'+t("best")+': '+m.seasonality.best.map(x=>t("month",x)).join(isEN()?", ":"・")+'</span>'+tripBadges(m)+'</div>'
        +'</article>';
    });
    html+='</div>';
  });
  main.innerHTML=html;
  wireCards();
}

/* weather-code → small icon for the hourly table */
function wxIcon(c){
  if(c==null) return "";
  if(c<=1) return "☀"; if(c===2) return "🌤"; if(c===3) return "☁";
  if(c===45||c===48) return "🌫";
  if(c>=95) return "⛈";
  if((c>=71&&c<=77)||c===85||c===86) return "❄";
  if(c>=51) return "🌧";
  return "";
}

/* Hour-by-hour panel for one day — opens when a grade in the 7-day strip is clicked */
function hourlyHTML(m,idx){
  const d=state.wx[m.id][idx]; const gr=gradeDay(m,d);
  const maxPr=Math.max(0.5,...d.hours.map(h=>h.pr||0));
  let rows="";
  d.hours.forEach((h,i)=>{
    const barW=Math.round((h.pr||0)/maxPr*60);
    rows+='<tr'+(i>=DAY_FROM&&i<DAY_TO?' class="hw"':'')+'><td class="hl">'+h.t+'</td>'
      +'<td>'+wxIcon(h.code)+'</td>'
      +'<td>'+(h.temp!=null?h.temp.toFixed(0)+'℃':'—')+'</td>'
      +'<td>'+(h.pr!=null?h.pr.toFixed(1):'0.0')+'mm'+(barW>0?'<span class="hbar" style="width:'+barW+'px"></span>':'')+'</td>'
      +'<td>'+(h.wind!=null?h.wind.toFixed(0):'—')+'（'+(h.gust!=null?h.gust.toFixed(0):'—')+'）m/s</td>'
      +'<td>'+(h.fl!=null?Math.round(h.fl)+'m':'—')+'</td></tr>';
  });
  const dl=d.daylight!=null?t("dur",Math.floor(d.daylight/3600),Math.round(d.daylight%3600/60)):"—";
  return '<div class="hourly"><h4>'+t("hourlyTitle",dayLabel(d.date),gr.g)+'</h4>'
    +(d.sunrise?'<p class="sunline">'+t("sun",d.sunrise,d.sunset,dl)+'</p>':'')
    +'<div class="reasons">'
      +nightTag(gr)
      +gr.warns.map(w=>'<span class="tag warn">⚠ '+w+'</span>').join("")
      +gr.reasons.map(r=>'<span class="tag">'+r+'</span>').join("")
      +'</div>'
    +'<table class="htable"><tr><th class="hl">'+t("hTime")+'</th><th></th><th>'+t("hTemp")+'</th><th>'+t("hPr")+'</th><th>'+t("hWind")+'</th><th>'+t("hFrz")+'</th></tr>'+rows+'</table>'
    +'<p class="om-note">'+t("dataLbl")+'<a href="'+omSiteUrl(m)+'" target="_blank" rel="noopener">'+t("omLink")+'</a></p></div>';
}

const flagHTML=(x,long)=>x.sample?'<span class="sample-flag">'+t(long?"sampleLong":"sample")+'</span>'
  :x.verified?'<span class="verified-flag">'+t("verified")+' '+x.verified+'</span>':'';

/* One trailhead's transit table — used by the mountain page and the route page */
function accessTableHTML(tr){
  let html='<p class="note"><b>'+tr.name+'</b></p><table><tr><th>'+t("thMode")+'</th><th>'+t("thLine")+'</th><th>'+t("thWkday")+'</th><th>'+t("thWkend")+'</th><th>'+t("thSeason")+'</th></tr>';
  tr.access.forEach(a=>{
    html+='<tr><td>'+modeName(a.mode)+(flagHTML(a)?'<br>'+flagHTML(a):'')+'</td>'
      +'<td>'+a.line+'<br><span class="mono">'+a.from+(a.duration&&a.duration!=="—"?' · '+a.duration:'')+'</span>'
      +(a.url&&a.url!=="#"?' <a href="'+a.url+'" target="_blank" rel="noopener">'+t("official")+'</a>':'')
      +'</td><td class="mono">'+a.weekday+'</td><td class="mono">'+a.weekend+'</td><td class="mono">'+a.season+'</td></tr>';
  });
  return html+'</table>';
}

/* Routes ordered for display: popularity (★) first, then official stamina grade */
function routesSorted(m){
  return m.routes.map((r,i)=>({r,i})).sort((a,b)=>
    ((b.r.popularity||0)-(a.r.popularity||0)) ||
    ((a.r.grade?a.r.grade.stamina:99)-(b.r.grade?b.r.grade.stamina:99)));
}

/* 山のグレーディング chips (official prefecture values, or dashed = our estimate) */
function gradeChipsHTML(r){
  if(!r.grade) return '';
  const g=r.grade, cls=g.official?'gchip official':'gchip est';
  let html='<div class="rgrades">'
    +'<span class="'+cls+'">'+t("stamina")+' '+g.stamina+'/10</span>'
    +'<span class="'+cls+'">'+t("skill")+' '+g.skill+'</span>';
  if(g.official) html+='<span class="grade-src">'+t("source")+': '+(g.url?'<a href="'+g.url+'" target="_blank" rel="noopener">'+g.src+'</a>':g.src)+'</span>';
  else html+='<span class="grade-src">'+t("estimate")+'</span>';
  return html+'</div>';
}

function openRoute(i){ location.hash="#/m/"+state.selected+"/r/"+i; }
const langNoteHTML=()=>isEN()?'<p class="lang-note">'+t("langNote")+'</p>':'';

function renderRoute(){
  const m=MOUNTAINS.find(x=>x.id===state.selected);
  const r=m.routes[state.routeIdx];
  const mName=isEN()?m.name_en:m.name_ja;
  let html='<div class="detail"><button class="back" id="backBtn">'+t("backTo",mName)+'</button>'
    +'<div class="dhead"><div class="ja" style="font-size:clamp(22px,4vw,30px)">'+r.name+'</div>'
    +'<div class="sub">'+m.name_ja+(isEN()?' ('+m.name_en+')':'')+' · '+regionLabel(m)+' · '+prefName(m.prefecture)+'</div>'
    +langNoteHTML()+'</div>';

  // overview: level, popularity, official grading, stats
  html+='<section class="block"><h3>'+t("hOverview")+'</h3>'
    +'<div class="rgrades"><span class="tag">'+levelName(r.level)+'</span>'
    +(r.popularity?'<span class="stars">'+"★★★".slice(0,r.popularity)+'</span>':'')+'</div>'
    +gradeChipsHTML(r)
    +'<p class="note" style="margin-top:8px">'+r.stats+'</p>'
    +'<p style="font-size:13px">'+r.note+'</p></section>';

  // segment times
  if(r.segments&&r.segments.length){
    html+='<section class="block"><h3>'+t("hSegments")+(flagHTML(r)?' '+flagHTML(r,true):'')+'</h3>'
      +'<table><tr><th>'+t("thSeg")+'</th><th>'+t("thUp")+'</th><th>'+t("thDown")+'</th></tr>';
    r.segments.forEach(s=>{
      html+='<tr><td>'+s.from+' → '+s.to+'</td><td class="mono">'+(s.up||'—')+'</td><td class="mono">'+(s.down||'—')+'</td></tr>';
    });
    html+='</table><p class="note">'+t("segNote")+'</p></section>';
  }

  // trailhead access (reuses the mountain's transit data — no duplication)
  if(r.trailhead!=null&&m.trailheads[r.trailhead]){
    const tr=m.trailheads[r.trailhead];
    const anySample=tr.access.some(a=>a.sample);
    html+='<section class="block"><h3>'+t("hAccess")+(anySample?' <span class="sample-flag">'+t("sampleLong")+'</span>':'')+'</h3>'
      +accessTableHTML(tr)+'</section>';
  }else{
    // trailhead:null = 縦走・周回など起点が単一でないルート
    html+='<section class="block"><h3>'+t("hAccess")+'</h3><p class="note">'+t("traverseNote",m.id,mName)+'</p></section>';
  }

  // map — GSI topo, opens in a new tab (zero dependencies)
  html+='<section class="block"><h3>'+t("hMap")+'</h3><p style="font-size:13px">'
    +'<a href="https://maps.gsi.go.jp/#14/'+m.coords.lat+'/'+m.coords.lon+'/" target="_blank" rel="noopener">'+t("gsiLink")+'</a>'
    +'<span class="note" style="display:block">'+t("gsiNote")+'</span></p></section>';

  html+='</div>';
  main.innerHTML=html;
  document.getElementById("backBtn").onclick=()=>{ location.hash="#/m/"+m.id; };
}

function renderDetail(){
  const m=MOUNTAINS.find(x=>x.id===state.selected);
  const days=state.wx[m.id];
  const nowMonth=new Date().getMonth()+1;
  let html='<div class="detail"><button class="back" id="backBtn">'+t("back")+'</button>'
    +'<div class="dhead"><div class="ja" style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">'+m.name_ja+(isEN()?' <span class="en-name" style="font-size:16px">'+m.name_en+'</span>':'')+favBtn(m)+'</div>'
    +'<div class="sub">'+(isEN()?'':m.name_en+' · ')+regionLabel(m)+' · '+prefName(m.prefecture)+' · '+t("elev")+' '+m.elevation+'m'+(m.hyakumeizan?' · '+t("hyakuLong"):'')+'</div>'
    +(tripBadges(m)?'<div class="reasons">'+tripBadges(m)+'</div>':'')
    +langNoteHTML()+'</div>';

  // 7-day strip (each day clickable → hourly panel); weather can be missing for this mountain
  html+='<section class="block"><h3>'+t("hWeek")+'</h3>';
  if(days){
    html+='<div class="strip">';
    days.forEach((d,i)=>{
      const gr=gradeDay(m,d);
      html+='<div class="daycell'+(state.hourIdx===i?' sel':'')+'" data-idx="'+i+'" tabindex="0">'
        +'<span class="d">'+fmtDate(d.date)+'('+youbi(d.date)+')</span><br>'
        +'<span class="gd '+gr.g.toLowerCase()+'">'+gr.g+'</span><br>'
        +t("stripShort",fmt(gr.dayWind),fmt(gr.dayPr))+'<br>'
        +fmt(d.tmin)+'/'+fmt(d.tmax)+'℃'
        +(gr.night!=null?'<br><span class="nightline">'+t("nightShort")+'</span>':"")
        +(gr.warns.length?'<br><span class="warnline">'+gr.warns[0]+'</span>':"")
        +'</div>';
    });
    html+='</div>';
    html+='<div id="hourlyBox">'+(state.hourIdx!=null?hourlyHTML(m,state.hourIdx):'')+'</div>';
  }else{
    html+='<p class="note">'+t("wxMissing")+' <button class="back" onclick="loadMissing()">'+t("retry")+'</button></p>';
  }
  html+='<p class="note">'+(days?t("weekNote",m.grading.ridgeline):'')+' '+(m.grading.snow_note||'')+'</p></section>';

  // seasonality
  html+='<section class="block"><h3>'+t("hSeason")+'</h3><div class="season-bar">';
  for(let i=1;i<=12;i++){
    html+='<div class="mcell'+(m.seasonality.best.includes(i)?" best":"")+(i===nowMonth?" now":"")+'">'+t("month",i)+'</div>';
  }
  html+='</div><ul class="snotes">';
  Object.keys(m.seasonality.notes).sort((a,b)=>a-b).forEach(k=>{
    html+='<li><b>'+t("month",+k)+'</b> — '+m.seasonality.notes[k]+'</li>';
  });
  html+='</ul></section>';

  // transit — SAMPLE flag only on unverified entries
  const anySample=m.trailheads.some(tr=>tr.access.some(a=>a.sample));
  html+='<section class="block"><h3>'+t("hTransit")+(anySample?' <span class="sample-flag">'+t("sampleLong")+'</span>':'')+'</h3>';
  m.trailheads.forEach(tr=>{ html+=accessTableHTML(tr); });
  html+='</section>';

  // huts — with official link + phone
  html+='<section class="block"><h3>'+t("hHuts")+'</h3>';
  if(m.huts.length){
    html+='<table><tr><th>'+t("thHut")+'</th><th>'+t("thElev")+'</th><th>'+t("thOpen")+'</th><th>'+t("thRes")+'</th><th>'+t("thTel")+'</th></tr>';
    m.huts.forEach(h=>{
      html+='<tr><td>'+(h.url&&h.url!=="#"?'<a href="'+h.url+'" target="_blank" rel="noopener">'+h.name+'</a>':h.name)
        +'</td><td class="mono">'+h.elevation+'m</td><td>'+h.open+'</td><td>'+h.reservation+'</td>'
        +'<td class="mono">'+(h.tel?'<a href="tel:'+h.tel.replace(/-/g,"")+'">'+h.tel+'</a>':'—')+'</td></tr>';
    });
    html+='</table>';
  }else{
    html+='<p class="note">'+t("noHuts")+'</p>';
  }
  html+='</section>';

  // routes — ★人気順、公的グレーディング付き。クリックで詳細ページへ
  html+='<section class="block"><h3>'+t("hRoutes")+'</h3><p class="note">'+t("routesNote")+'</p>';
  routesSorted(m).forEach(({r,i})=>{
    html+='<div class="route-card" tabindex="0" data-ridx="'+i+'">'
      +'<div class="rname">'+r.name+' <span class="tag">'+levelName(r.level)+'</span>'
      +(r.popularity?' <span class="stars">'+"★★★".slice(0,r.popularity)+'</span>':'')+'</div>'
      +gradeChipsHTML(r)
      +'<div class="rstats">'+r.stats+'</div>'
      +'<div style="font-size:13px;margin-top:4px">'+r.note+'</div>'
      +'<div class="ropen">'+t("routeOpen")+'</div></div>';
  });
  html+='</section></div>';

  main.innerHTML=html;
  wireCards();
  document.getElementById("backBtn").onclick=()=>{ location.hash=(state.prevView==="mtn")?"#/mtn":(state.prevView==="map")?"#/map":"#/d/"+state.dayIndex; };
  main.querySelectorAll(".route-card").forEach(c=>{
    const open=()=>openRoute(+c.dataset.ridx);
    c.onclick=open; c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}};
  });
  main.querySelectorAll(".daycell").forEach(c=>{
    const toggle=()=>{
      const i=+c.dataset.idx;
      state.hourIdx=(state.hourIdx===i?null:i);
      renderDetail();
    };
    c.onclick=toggle; c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}};
  });
}

function render(){
  if(!state.loaded) return;
  document.getElementById("tab-date").classList.toggle("active",state.view==="date");
  document.getElementById("tab-mtn").classList.toggle("active",state.view==="mtn");
  document.getElementById("tab-map").classList.toggle("active",state.view==="map");
  document.getElementById("tab-date").setAttribute("aria-selected",state.view==="date");
  document.getElementById("tab-mtn").setAttribute("aria-selected",state.view==="mtn");
  document.getElementById("tab-map").setAttribute("aria-selected",state.view==="map");
  syncFilters();
  setTitle();
  if(state.view==="date") renderByDate();
  else if(state.view==="mtn") renderMtnList();
  else if(state.view==="map") renderMap();
  else if(state.view==="route") renderRoute();
  else renderDetail();
}

/* Static page text (header, tabs, footer) for the current language. */
function applyStaticText(){
  document.documentElement.lang=state.lang;
  document.getElementById("tagline").textContent=t("tagline");
  const lb=document.getElementById("langBtn"); lb.textContent=t("langBtn"); lb.setAttribute("aria-label",t("langLabel"));
  document.getElementById("tab-date").textContent=t("tabDate");
  document.getElementById("tab-mtn").textContent=t("tabMtn");
  document.getElementById("tab-map").textContent=t("tabMap");
  document.getElementById("footer").innerHTML=t("footer");
}
function setLang(l){
  state.lang=l;
  try{ localStorage.setItem(LANG_KEY,l); }catch(e){ /* private mode — choice just won't persist */ }
  applyStaticText(); labelFilterChips(); buildDateChips(); renderStatus(); render();
}

document.getElementById("tab-date").onclick=()=>{ location.hash="#/d/"+state.dayIndex; };
document.getElementById("tab-mtn").onclick=()=>{ location.hash="#/mtn"; };
document.getElementById("tab-map").onclick=()=>{ location.hash="#/map"; };
document.getElementById("langBtn").onclick=()=>setLang(isEN()?"ja":"en");
window.addEventListener("hashchange",applyHash);
applyStaticText();
buildFilterChips();
document.getElementById("status").textContent=t("loading",0,MOUNTAINS.length);
loadAll();
</script>
</body>
</html>
